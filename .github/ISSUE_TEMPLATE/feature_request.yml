name: Feature request
description: An idea for something Agent Monitor could show or do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to see or do?
      description: Describe the situation you were in and what was missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Sketches and screenshots are welcome.
